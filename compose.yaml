name: ai-support-agent

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-support}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ./backend/app:/workspace/backend/app
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql://support:support_dev_password@postgres:5432/support}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy

  customer-web:
    build:
      context: .
      dockerfile: apps/customer-web/Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    volumes:
      - ./apps/customer-web/src:/app/src
      - ./apps/customer-web/index.html:/app/index.html
      - ./apps/customer-web/vite.config.ts:/app/vite.config.ts
    depends_on:
      backend:
        condition: service_healthy

  operator-web:
    build:
      context: .
      dockerfile: apps/operator-web/Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:${OPERATOR_WEB_PORT:-3001}:3001"]
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    volumes:
      - ./apps/operator-web/src:/app/src
      - ./apps/operator-web/index.html:/app/index.html
      - ./apps/operator-web/vite.config.ts:/app/vite.config.ts
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
